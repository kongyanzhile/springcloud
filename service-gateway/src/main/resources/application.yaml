# 应用服务 WEB 访问端口
server:
  port: 8888

spring:
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.184.135:8848
      config:
        server-addr: 192.168.184.135:8848
        file-extension: yaml
    gateway:
#      routes:
#        - id: springcloud-consumer
#          uri: http://localhost:8081
#          predicates:
#            - Path=/ware/**
#        - id: springcloud-provider
#          uri: http://localhost:8080
#          predicates:
#            - Path=/product/**
#        - id: springcloud-provider
#          uri: http://localhost:8083
#          predicates:
#            - Path=/user/**
      server:
        webflux:
          routes:
          - id: springcloud-consumer
            uri: http://localhost:8081
            predicates:
              - Path=/ware/**
          - id: springcloud-provider
            uri: http://localhost:8080
            predicates:
              - Path=/product/**
          - id: springcloud-user
            uri: http://localhost:8083
            predicates:
              - Path=/user/**

  application:
    name: service-gateway
  data:
    redis:
      host: localhost
      port: 6379
app:
  auth:
    noauthurl:
      - /css/**
      - /js/**
      - /img/**
      - /user/**
#      - /ware/**
#      - /product/**
    authurl:
      - /ware/**
      - /product/**
